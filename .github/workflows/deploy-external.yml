name: Deploy External App
on:
  push:
    branches: [ "external" ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: azure/webapps-deploy@v2
        with:
          app-name: recsapp-external
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_EXTERNAL }}